[package]
name = "forgebrain-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "BrainStorm — realtime quiz platform (Rust server)"
license.workspace = true

[lib]
name = "brainstorm"
path = "src/lib.rs"

[dependencies]
# Web framework
axum = { workspace = true }
axum-extra = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
http = { workspace = true }

# Metrics
prometheus = { workspace = true }

# Async runtime
tokio = { workspace = true }
futures = "0.3"

# Database
sqlx = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Config
figment = { workspace = true }

# Logging / tracing
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Errors
thiserror = { workspace = true }
anyhow = { workspace = true }

# Password hashing
argon2 = "0.5"
password-hash = "0.5"

# HTTP client (for AI providers)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Validation
validator = { version = "0.18", features = ["derive"] }

# Time
chrono = { workspace = true }

# Crypto / HMAC
hmac = "0.12"
sha2 = "0.10"
rand = "0.8"

# Session / state
dashmap = { workspace = true }

# Utilities
base64 = "0.22"
uuid = { workspace = true }
bytes = "1"
parking_lot = { workspace = true }
async-trait = "0.1"
dotenvy = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tower = { version = "0.4", features = ["util"] }
sqlx = { workspace = true }
insta = { version = "1", features = ["json"] }

[features]
# Rate limiting is implemented but not wired: behind Caddy `ConnectInfo` is the
# proxy address, so keying by it would throttle every player together. Enable
# once the limiter keys on X-Forwarded-For; see src/middleware/rate_limit.rs.
rate-limit = []
