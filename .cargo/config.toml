[alias]
# Development
xt = "run --package xtask --"
dev = "run --package forgebrain-server"

# Testing
test-all = "test --workspace --all-targets"
test-unit = "test --workspace --lib"
test-integration = "test --workspace --test '*'"

# Quality
clippy-all = "clippy --workspace --all-targets -- -D warnings"
fmt-check = "fmt --all -- --check"
fmt-fix = "fmt --all"

# Build
build-release = "build --workspace --release"
check-all = "check --workspace --all-targets"

# Benchmarks
bench-all = "bench --workspace"

[build]
# Use multiple codegen units for faster dev builds
# (release profile overrides this with codegen-units = 1)
# incremental = true

[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "link-arg=-fuse-ld=lld"]

[target.aarch64-unknown-linux-gnu]
rustflags = ["-C", "link-arg=-fuse-ld=lld"]
