# Единая конфигурация линта: результат не зависит от машины.
# ruff ставится в CI без пина из PyPI, поэтому набор правил задаём явно здесь,
# а не полагаемся на значение по умолчанию.
line-length = 120
target-version = "py312"

[lint]
# Блокирующий набор — то, что ломает исполнение: синтаксис, неопределённые
# имена, неиспользуемые импорты и переменные. Стилевые наборы (E4/E7, BLE, SIM)
# в этом коде дают 300+ замечаний; они вынесены в
# docs/development/code-style.md как задача постепенного ужесточения.
select = ["E9", "F"]
ignore = ["E501"]
