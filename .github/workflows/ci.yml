name: CI

# The merge of two branches left this file with duplicated job keys (`rust` and
# `frontend` each defined twice), which GitHub rejects outright: every run failed
# in 0s with "workflow file issue". One job per concern, no duplicates.

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  rust:
    name: Rust formatting, build, Clippy and tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: rust-server
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-server
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Check all targets
        run: cargo check --all-targets --locked
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Tests
        # Tests that need a live database are #[ignore]d and require DATABASE_URL.
        run: cargo test --locked

  security-audit:
    name: Security audit (cargo audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: rust-server
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Run security audit
        run: cargo audit

  frontend:
    name: Svelte type check and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Check Svelte and TypeScript
        run: npm run check
      - name: Build frontend
        run: npm run build

  legacy-api:
    # The original Flask implementation still ships (root Dockerfile, Procfile) and
    # keeps its own tests; it is checked so it cannot rot silently.
    name: Legacy Flask API — lint, tests, boot
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies (pinned)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock.txt
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check app tests

      - name: Tests
        run: python -m pytest -q

      - name: The app starts without optional integrations
        env:
          SECRET_KEY: ci-secret-key-that-is-long-enough-000
          ADMIN_SECRET_KEY: "ci-admin-secret-key-000"
          CHEAT_TESTER_CODE: "19112009"
          DATA_DIR: /tmp/brainstorm-ci
        run: |
          python - <<'PY'
          from app import create_app
          app = create_app()
          client = app.test_client()
          response = client.get("/health")
          assert response.status_code == 200, response.status_code
          print("health:", response.get_json())
          PY

  docker:
    # The Rust image needs Postgres to boot (DATABASE_URL is mandatory), so the job
    # brings up a service container and runs the server with --network host.
    name: Rust image builds and answers /health
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: brainstorm
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Build the Rust server image
        run: docker build -t brainstorm-rust:ci rust-server
      - name: Run and probe /health
        run: |
          docker run -d --name brainstorm-rust-ci --network host \
            -e SECRET_KEY=ci-secret-key-that-is-long-enough-000 \
            -e DATABASE_URL=postgres://postgres:postgres@127.0.0.1:5432/brainstorm \
            -e BRAINSTORM__DEFAULT_AI_PROVIDER=mock \
            brainstorm-rust:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5000/health >/dev/null 2>&1; then
              echo "container healthy"; exit 0
            fi
            sleep 2
          done
          docker logs brainstorm-rust-ci; exit 1

  secrets:
    # gitleaks-action@v2 requires a paid licence for organisations and fails without
    # it, which turned the check into a red cross that verified nothing. The same
    # pinned gitleaks binary is downloaded and run directly: reproducible, no secrets.
    name: No committed secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.28.0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks (pinned)
        run: |
          curl -sSfL -o /tmp/gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks version
      - name: Scan the working tree (blocking)
        run: /tmp/gitleaks dir --config .gitleaks.toml --redact --no-banner -v .
      - name: Scan the whole git history (informational)
        # History still contains a GigaChat key from a removed .env. Revoking it and
        # rewriting history is the repository owner's call: see
        # docs/security/threat-model.md. The working-tree scan above is blocking.
        continue-on-error: true
        run: |
          echo "::warning::history scan: revoke any secrets found, then purge history"
          /tmp/gitleaks git --config .gitleaks.toml --redact --no-banner -v .

  docs:
    name: Documentation is complete and linked
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Structural checks
        run: ./scripts/docs-check.sh
