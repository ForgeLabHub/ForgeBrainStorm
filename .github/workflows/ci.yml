name: CI

# Раньше проверок не было совсем: тесты существовали, но их никто не запускал
# автоматически. Этот workflow — минимальный, но обязательный набор.

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  backend:
    name: Tests, lint and a runnable app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies (pinned)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock.txt
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check app tests

      - name: Tests
        run: python -m pytest -q

      - name: The app starts without optional integrations
        env:
          SECRET_KEY: ci-secret-key-that-is-long-enough-000
          # Валидатор конфигурации требует ≥12 символов: это проверяется здесь же.
          ADMIN_SECRET_KEY: "ci-admin-secret-key-000"
          CHEAT_TESTER_CODE: "19112009"
          DATA_DIR: /tmp/brainstorm-ci
        run: |
          python - <<'PY'
          from app import create_app
          app = create_app()
          client = app.test_client()
          response = client.get("/health")
          assert response.status_code == 200, response.status_code
          print("health:", response.get_json())
          PY

  secrets:
    # gitleaks-action@v2 для организаций требует платную лицензию
    # (GITLEAKS_LICENSE) и падает без неё — проверка превращалась в «красный
    # крестик», который ничего не проверял. Скачиваем тот же gitleaks
    # закреплённой версии и запускаем его напрямую: воспроизводимо, без секретов.
    name: No committed secrets
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.28.0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks (pinned)
        run: |
          curl -sSfL -o /tmp/gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks version
      - name: Scan the working tree (blocking)
        run: /tmp/gitleaks dir --config .gitleaks.toml --redact --no-banner -v .
      - name: Scan the whole git history (informational)
        # В истории до этой ветки остаётся ключ GigaChat из удалённого .env.
        # Проверка обязательна, но не блокирует сборку, пока ключ не отозван и
        # история не очищена: это решение владельца репозитория, см.
        # docs/security/threat-model.md. Шаг «working tree» выше — блокирующий.
        continue-on-error: true
        run: |
          echo "::warning::проверка истории: найденные секреты нужно отозвать, а историю очистить"
          /tmp/gitleaks git --config .gitleaks.toml --redact --no-banner -v .

  docker:
    name: Image builds and passes the health check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t brainstorm:ci .
      - name: Run and probe /health
        run: |
          docker run -d --name brainstorm-ci -p 5000:5000 \
            -e SECRET_KEY=ci-secret-key-that-is-long-enough-000 \
            -e ADMIN_SECRET_KEY=ci-admin-secret-key-000 \
            -e CHEAT_TESTER_CODE=19112009 \
            brainstorm:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5000/health >/dev/null 2>&1; then
              echo "контейнер здоров"; exit 0
            fi
            sleep 2
          done
          docker logs brainstorm-ci; exit 1

  docs:
    name: Documentation is complete and linked
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Structural checks
        run: ./scripts/docs-check.sh
