[package]
name = "brainstorm"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "BrainStorm — realtime quiz platform (Rust rewrite)"
license = "MIT"

[dependencies]
# Web framework
axum = { version = "0.7", features = ["ws", "macros"] }
axum-extra = { version = "0.9", features = ["typed-header", "cookie"] }
tower = { version = "0.4", features = ["timeout", "limit", "filter"] }
tower-http = { version = "0.5", features = ["cors", "trace", "fs", "catch-panic", "set-header", "request-id", "util"] }
http = "1.1"

# Async runtime
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "migrate", "json"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Config
figment = { version = "0.10", features = ["toml", "env"] }

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
tracing-opentelemetry = "0.24"

# Errors
thiserror = "1"
anyhow = "1"

# Password hashing
argon2 = "0.5"
password-hash = "0.5"

# HTTP client (for GigaChat)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Validation
validator = { version = "0.18", features = ["derive"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Crypto / HMAC
hmac = "0.12"
sha2 = "0.10"
rand = "0.8"

# Session / state
dashmap = "6"
uuid = { version = "1", features = ["v4", "serde"] }

# Utilities
base64 = "0.22"
bytes = "1"
parking_lot = "0.12"
async-trait = "0.1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
tower = { version = "0.4", features = ["util"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "migrate"] }
insta = { version = "1", features = ["json"] }

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
opt-level = 3

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
