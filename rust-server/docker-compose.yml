# Local development stack: BrainStorm + PostgreSQL + Redis.
# Usage: docker compose up

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: brainstorm
      POSTGRES_PASSWORD: brainstorm
      POSTGRES_DB: brainstorm
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brainstorm"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "5000:5000"
    environment:
      BRAINSTORM_ENV: development
      BRAINSTORM_DATABASE_URL: postgres://brainstorm:brainstorm@postgres:5432/brainstorm
      BRAINSTORM_REDIS_URL: redis://redis:6379
      BRAINSTORM_SECRET_KEY: dev-secret-for-local-testing-only-change-in-production
      BRAINSTORM_ADMIN_SECRET_KEY: admin-secret-for-local-testing
      BRAINSTORM_GIGACHAT_CREDENTIALS: ${GIGACHAT_CREDENTIALS:-}
      BRAINSTORM_TRUST_PROXY: "false"
      BRAINSTORM_SESSION_COOKIE_SECURE: "false"
      BRAINSTORM_CORS_ORIGINS: '["http://localhost:5173","http://localhost:3000"]'
      RUST_LOG: brainstorm=info,tower_http=debug
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./config:/app/config:ro
      - ./migrations:/app/migrations:ro

volumes:
  postgres_data:
