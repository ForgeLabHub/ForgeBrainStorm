# BrainStorm default configuration.
# Override any value via environment variables prefixed with BRAINSTORM_.
# Example: BRAINSTORM_SECRET_KEY=... or simply SECRET_KEY=...

[env]
# "development" or "production".
env = "development"

# Bind address.
listen = "0.0.0.0:5000"

# Secret key for HMAC, sessions, CSRF. Must be ≥ 32 bytes in production.
secret_key = "dev-secret-change-me-in-production-please-use-a-long-random-string"

# Admin activation key.
admin_secret_key = ""

# PostgreSQL connection string.
database_url = "postgres://brainstorm:brainstorm@localhost:5432/brainstorm"

# Database connection pool size.
db_pool_size = 20

# GigaChat API credentials (OAuth client secret).
gigachat_credentials = ""
gigachat_scope = "GIGACHAT_API_PERS"
gigachat_model = "GigaChat"

# Maximum concurrent AI requests.
ai_concurrency = 4

# CORS allowed origins. Empty = deny all. "*" is forbidden in production.
cors_origins = ["http://localhost:5173", "http://localhost:3000"]

# Trust X-Forwarded-* headers from upstream proxies (Render, Fly.io, etc).
trust_proxy = false

# Session cookie security.
session_cookie_secure = false
session_ttl_secs = 86400  # 24 hours

# Redis URL (optional in dev, required in production for rate-limit/sessions).
redis_url = ""

# Rate limiting.
rate_limit_enabled = true
auth_rate_limit = 10
auth_rate_window = 60

# Room limits.
max_rooms = 200
max_players = 30
disconnect_grace_secs = 30
