# Local development infrastructure for the Rust + SvelteKit stack.
#
#   docker compose up -d postgres redis
#   (cd rust-server && cargo run)          # :5000
#   (cd frontend && npm run dev)           # :5173, proxies /api and /ws
#
# The whole stack behind Caddy (TLS, WebSocket, static frontend):
#   deploy/docker-compose.prod.yml

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: brainstorm
      POSTGRES_PASSWORD: brainstorm
      POSTGRES_DB: brainstorm
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brainstorm"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    command: redis-server --appendonly yes

volumes:
  postgres_data:
  redis_data:
